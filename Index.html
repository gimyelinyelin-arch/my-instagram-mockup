<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mood — my space</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fff;--text:#262626;--muted:#8e8e8e;--line:#eee;--soft:#fafafa;--accent:#6d75d8}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.layout{display:grid;grid-template-columns:220px minmax(0,650px) 280px;gap:35px;max-width:1240px;margin:auto;padding:0 24px}
.sidebar{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);padding:28px 18px 20px 0;display:flex;flex-direction:column;gap:10px}
.logo{font-family:Georgia,serif;font-size:32px;font-style:italic;margin:10px 12px 28px}
.nav{display:flex;align-items:center;gap:15px;padding:13px 12px;border-radius:10px;border:0;background:transparent;text-align:left;font-size:15px}
.nav:hover,.nav.active{background:#f5f5f5}
.nav span{font-size:22px;width:25px;text-align:center}
.main{min-width:0;padding:28px 0 60px}
.stories{display:flex;gap:18px;overflow:auto;padding:8px 2px 24px;margin-bottom:10px}
.story{border:0;background:none;min-width:65px;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:#555}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#ffb64c,#d64c9b,#7659db)}
.ring img,.ring .placeholder{width:100%;height:100%;border-radius:50%;border:2px solid white;object-fit:cover;background:#eee;display:flex;align-items:center;justify-content:center;font-size:24px}
.post{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:24px}
.posthead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#eee}
.user{font-weight:650;font-size:14px}
.small{font-size:12px;color:var(--muted);margin-top:3px}
.more{margin-left:auto;border:0;background:none;font-size:20px}
.postimg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:3px;background:#f4f4f4;display:block}
.actions{display:flex;align-items:center;gap:17px;padding:10px 0 5px}
.action{border:0;background:none;padding:0;font-size:25px}
.action:hover{opacity:.65}
.save{margin-left:auto}
.likes{font-size:14px;font-weight:650;margin:3px 0 7px}
.caption{font-size:14px;line-height:1.55}
.comments{font-size:13px;color:var(--muted);border:0;background:none;padding:8px 0}
.commentrow{display:flex;gap:8px;margin-top:8px}
.commentrow input{flex:1;min-width:0;border:0;outline:0;font-size:13px}
.commentrow button{border:0;background:none;color:var(--accent);font-weight:650}
.right{padding-top:48px}
.me{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.me img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.meinfo{flex:1;min-width:0}
.linkbtn{border:0;background:none;color:var(--accent);font-size:12px;font-weight:650}
.sectiontitle{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:650;margin-bottom:18px}
.suggestion{display:flex;align-items:center;gap:10px;margin:16px 0}
.suggestion img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.suggestion .user{font-size:13px}
.suggestion .small{font-size:11px}
.suggestion .linkbtn{margin-left:auto}
.bio{font-size:12px;line-height:1.8;color:var(--muted);margin-top:35px}
.profile{padding:20px 0 35px;border-bottom:1px solid var(--line);margin-bottom:28px}
.profiletop{display:flex;align-items:center;gap:25px;margin-bottom:25px}
.profilepic{width:105px;height:105px;border-radius:50%;object-fit:cover;background:#eee}
.profileinfo{flex:1;min-width:0}
.profilerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.profileinfo h2{font-weight:400;font-size:22px;margin:0}
.lightbtn{border:1px solid #ddd;background:#fff;border-radius:8px;padding:7px 12px;font-size:13px}
.stats{display:flex;gap:28px;font-size:14px;margin-bottom:16px}
.stats b{font-weight:650}
.bioedit{font-size:14px;line-height:1.7;white-space:pre-wrap}
.gridposts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.gridposts img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;background:#f4f4f4}
.empty{text-align:center;color:var(--muted);padding:45px 10px;grid-column:1/-1}
.dmwrap{display:grid;grid-template-columns:180px minmax(0,1fr);height:70vh;min-height:430px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dmpeople{border-right:1px solid var(--line);overflow:auto}
.dmpeople h3{font-size:17px;padding:10px 12px}
.dmuser{display:flex;align-items:center;gap:8px;padding:12px 8px;border:0;background:white;width:100%;text-align:left}
.dmuser.active,.dmuser:hover{background:#f6f6f6}
.dmuser img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.dmchat{display:flex;flex-direction:column;min-width:0}
.dmhead{padding:13px;border-bottom:1px solid var(--line);font-weight:650}
.messages{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.bubble{padding:10px 13px;border-radius:18px;max-width:80%;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:var(--accent);color:white}
.theirs{align-self:flex-start;background:#f1f1f1}
.dmform{display:flex;padding:12px;gap:8px;border-top:1px solid var(--line)}
.dmform input{flex:1;min-width:0;border:1px solid #ddd;border-radius:22px;padding:10px 13px;outline:0}
.dmform button{border:0;background:none;color:var(--accent);font-weight:650}
.modalbg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modalbg.show{display:flex}
.modal{background:white;border-radius:14px;width:min(420px,100%);padding:22px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 18px}
.modal input,.modal textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px}
.modal textarea{resize:vertical;min-height:75px}
.modalbuttons{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.primary{background:var(--accent);color:white;border:0;border-radius:8px;padding:10px 15px}
.cancel{border:1px solid #ddd;background:white;border-radius:8px;padding:10px 15px}
.mobilebar{display:none}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border-radius:20px;padding:11px 18px;font-size:13px;display:none;z-index:9}
@media(max-width:1000px){.layout{grid-template-columns:75px minmax(0,650px);gap:25px;justify-content:center}.sidebar{align-items:center;padding-right:10px}.logo{font-size:0;margin:12px 0 25px}.logo:first-letter{font-size:30px}.nav{justify-content:center;padding:13px 8px}.nav .label{display:none}.right{display:none}}
@media(max-width:600px){.layout{display:block;padding:0 12px}.sidebar{display:none}.main{padding:12px 0 75px}.stories{gap:13px;margin-bottom:4px;padding-bottom:18px}.ring{width:58px;height:58px}.post{margin-bottom:20px}.postimg{border-radius:2px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;height:55px;background:#fff;border-top:1px solid var(--line);justify-content:space-around;align-items:center;z-index:3}.mobilebar button{border:0;background:none;font-size:23px}.profiletop{gap:15px}.profilepic{width:80px;height:80px}.profileinfo h2{font-size:18px}.stats{gap:15px;font-size:12px}.profilerow{gap:6px;margin-bottom:12px}.lightbtn{padding:6px 8px;font-size:12px}.dmwrap{grid-template-columns:105px minmax(0,1fr);height:68vh}.dmuser{gap:4px;padding:10px 4px}.dmuser .user{font-size:11px}.dmuser img{width:28px;height:28px}.dmpeople h3{font-size:13px;padding:8px 5px}.bubble{font-size:13px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="logo">mood.</div>
  <button class="nav active" onclick="showPage('home',this)"><span>⌂</span><span class="label">홈</span></button>
  <button class="nav" onclick="showPage('search',this)"><span>⌕</span><span class="label">둘러보기</span></button>
  <button class="nav" onclick="showPage('dm',this)"><span>✉</span><span class="label">메시지</span></button>
  <button class="nav" onclick="addStory()"><span>◉</span><span class="label">스토리 추가</span></button>
  <button class="nav" onclick="newPost()"><span>⊕</span><span class="label">게시물 만들기</span></button>
  <button class="nav" onclick="showPage('profile',this)"><span>♙</span><span class="label">프로필</span></button>
  <div style="flex:1"></div>
  <button class="nav" onclick="editProfile()"><span>⚙</span><span class="label">프로필 설정</span></button>
</aside>

<main class="main" id="main"></main>

<aside class="right">
  <div class="me">
    <img id="sideAvatar" alt="프로필">
    <div class="meinfo"><div class="user" id="sideUser"></div><div class="small" id="sideName"></div></div>
    <button class="linkbtn" onclick="editProfile()">편집</button>
  </div>
  <div class="sectiontitle"><span>추천 계정</span><span>모두 보기</span></div>
  <div id="suggestions"></div>
  <div class="bio">소개 · 도움말 · 개인정보 · 약관<br>위치는 연습용 화면입니다.<br><br>© 2026 mood.</div>
</aside>
</div>

<nav class="mobilebar">
  <button onclick="showPage('home')">⌂</button>
  <button onclick="showPage('search')">⌕</button>
  <button onclick="newPost()">⊕</button>
  <button onclick="showPage('dm')">✉</button>
  <button onclick="showPage('profile')">♙</button>
</nav>

<div class="modalbg" id="modalbg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>
<input id="photoPicker" type="file" accept="image/*" hidden>
<input id="storyPicker" type="file" accept="image/*" hidden>

<script>
const defaultAvatar='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop';
const photos=[
'https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900',
'https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=900',
'https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=900',
'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900',
'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=900'
];
const people=[
{name:'sooo',avatar:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200'},
{name:'min.0',avatar:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200'},
{name:'dayoff',avatar:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=200'},
{name:'archive',avatar:'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200'}
];
let profile=JSON.parse(localStorage.getItem('mood-profile')||'null')||{username:'your.name',name:'Your Name',bio:'오늘의 기록 ✷\ncollecting little moments',avatar:defaultAvatar};
let posts=JSON.parse(localStorage.getItem('mood-posts')||'null')||photos.slice(0,3).map((url,i)=>({id:i+1,url,caption:['a little moment ☁️','somewhere, sometime.','slow days, good days'][i],likes:Math.floor(20+Math.random()*80),liked:false,comments:[]}));
let stories=JSON.parse(localStorage.getItem('mood-stories')||'null')||[];
let messages=JSON.parse(localStorage.getItem('mood-messages')||'null')||{};
let activeDM=0;
let currentPage='home';
let nextId=Date.now();

function save(){
 try{
 localStorage.setItem('mood-profile',JSON.stringify(profile));
 localStorage.setItem('mood-posts',JSON.stringify(posts));
 localStorage.setItem('mood-stories',JSON.stringify(stories));
 localStorage.setItem('mood-messages',JSON.stringify(messages));
 }catch(e){toast('저장 공간이 부족해요. 사진 크기를 줄여 주세요.');}
}
function toast(msg){
 const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';
 clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2400);
}
function avatarHTML(src,cls='avatar'){return `<img class="${cls}" src="${esc(src)}" alt="" onerror="this.src='${defaultAvatar}'">`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function syncSide(){
 document.getElementById('sideAvatar').src=profile.avatar;
 document.getElementById('sideUser').textContent=profile.username;
 document.getElementById('sideName').textContent=profile.name;
 document.getElementById('suggestions').innerHTML=people.map(p=>`<div class="suggestion">${avatarHTML(p.avatar)}<div><div class="user">${p.name}</div><div class="small">회원님을 위한 추천</div></div><button class="linkbtn" onclick="toast('목업 기능이에요!')">팔로우</button></div>`).join('');
}
function showPage(page,btn){
 currentPage=page;
 document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
 if(btn)btn.classList.add('active');
 const main=document.getElementById('main');
 if(page==='home')main.innerHTML=renderHome();
 if(page==='profile')main.innerHTML=renderProfile();
 if(page==='search')main.innerHTML=renderSearch();
 if(page==='dm')main.innerHTML=renderDM();
 syncSide();
}
function renderStories(){
 return `<div class="stories">
 <button class="story" onclick="addStory()"><div class="ring"><div class="placeholder">＋</div></div><span>내 스토리</span></button>
 ${stories.map((s,i)=>`<button class="story" onclick="viewStory(${i})"><div class="ring"><img src="${esc(s.url)}" alt=""></div><span>${esc(s.label||'your.story')}</span></button>`).join('')}
 ${people.map(p=>`<button class="story" onclick="toast('스토리 예시입니다')"><div class="ring">${avatarHTML(p.avatar,'placeholder')}</div><span>${p.name}</span></button>`).join('')}
 </div>`;
}
function renderPost(p){
 return `<article class="post">
 <div class="posthead">${avatarHTML(profile.avatar)}<div><div class="user">${esc(profile.username)}</div><div class="small">나의 기록</div></div><button class="more" onclick="deletePost(${p.id})">···</button></div>
 <img class="postimg" src="${esc(p.url)}" alt="게시물 사진" onerror="this.style.background='#eee'">
 <div class="actions">
 <button class="action" onclick="toggleLike(${p.id})">${p.liked?'❤️':'♡'}</button>
 <button class="action" onclick="commentPost(${p.id})">♧</button>
 <button class="action" onclick="toast('개인용 목업이에요!')">➤</button>
 <button class="action save" onclick="toast('저장했어요!')">♧</button>
 </div>
 <div class="likes">좋아요 ${p.likes.toLocaleString()}개</div>
 <div class="caption"><b>${esc(profile.username)}</b> ${esc(p.caption)}</div>
 ${(p.comments||[]).slice(-2).map(c=>`<div class="caption" style="margin-top:5px"><b>${esc(c.user)}</b> ${esc(c.text)}</div>`).join('')}
 <button class="comments" onclick="commentPost(${p.id})">댓글 ${p.comments?.length||0}개 모두 보기</button>
 <div class="commentrow"><input id="comment-${p.id}" placeholder="댓글 달기..." onkeydown="if(event.key==='Enter')submitComment(${p.id})"><button onclick="submitComment(${p.id})">게시</button></div>
 </article>`;
}
function renderHome(){
 return renderStories()+posts.slice().reverse().map(renderPost).join('')||'<div class="empty">아직 게시물이 없어요.</div>';
}
function renderProfile(){
 return `<section class="profile">
 <div class="profiletop">${avatarHTML(profile.avatar,'profilepic')}<div class="profileinfo">
 <div class="profilerow"><h2>${esc(profile.username)}</h2><button class="lightbtn" onclick="editProfile()">프로필 편집</button><button class="lightbtn" onclick="showPage('dm')">메시지</button></div>
 <div class="stats"><span><b>${posts.length}</b> 게시물</span><span><b>128</b> 팔로워</span><span><b>205</b> 팔로잉</span></div>
 <div class="user">${esc(profile.name)}</div><div class="bioedit">${esc(profile.bio)}</div>
 </div></div></section>
 <div class="gridposts">${posts.slice().reverse().map(p=>`<img src="${esc(p.url)}" alt="게시물" onclick="openPost(${p.id})">`).join('')||'<div class="empty">첫 게시물을 올려 봐!</div>'}</div>`;
}
function renderSearch(){
 return `<h2 style="font-size:20px;font-weight:500;margin:0 0 20px">둘러보기</h2><div class="gridposts">${[...posts.map(p=>p.url),...photos].map((url,i)=>`<img src="${esc(url)}" alt="사진" onclick="toast('둘러보기 예시 사진이에요')">`).join('')}</div>`;
}
function renderDM(){
 return `<div class="dmwrap"><div class="dmpeople"><h3>메시지</h3>${people.map((p,i)=>`<button class="dmuser ${i===activeDM?'active':''}" onclick="selectDM(${i})">${avatarHTML(p.avatar)}<span class="user">${p.name}</span></button>`).join('')}</div>
 <div class="dmchat"><div class="dmhead">${people[activeDM].name}</div><div class="messages" id="messages"></div>
 <form class="dmform" onsubmit="sendDM(event)"><input id="dmInput" placeholder="메시지 보내기..." autocomplete="off"><button>보내기</button></form></div></div>`;
}
function drawMessages(){
 const el=document.getElementById('messages');if(!el)return;
 const list=messages[activeDM]||[];
 el.innerHTML=list.map(m=>`<div class="bubble ${m.mine?'mine':'theirs'}">${esc(m.text)}</div>`).join('');
 el.scrollTop=el.scrollHeight;
}
function selectDM(i){activeDM=i;showPage('dm');drawMessages()}
function sendDM(e){
 e.preventDefault();const input=document.getElementById('dmInput');const text=input.value.trim();if(!text)return;
 messages[activeDM]=messages[activeDM]||[];messages[activeDM].push({text,mine:true});save();input.value='';drawMessages();
}
function openModal(content){document.getElementById('modal').innerHTML=content;document.getElementById('modalbg').classList.add('show')}
function closeModal(){document.getElementById('modalbg').classList.remove('show')}
function editProfile(){
 openModal(`<h3>프로필 편집</h3><label>사용자 이름</label><input id="editUser" value="${esc(profile.username)}"><label>이름</label><input id="editName" value="${esc(profile.name)}"><label>소개</label><textarea id="editBio">${esc(profile.bio)}</textarea><label>프로필 사진</label><input id="editAvatar" type="file" accept="image/*"><div class="modalbuttons"><button class="cancel" onclick="closeModal()">취소</button><button class="primary" onclick="saveProfile()">저장</button></div>`);
}
function saveProfile(){
 profile.username=document.getElementById('editUser').value.trim()||'your.name';
 profile.name=document.getElementById('editName').value.trim();
 profile.bio=document.getElementById('editBio').value;
 const file=document.getElementById('editAvatar').files[0];
 if(file){compress(file,url=>{profile.avatar=url;finishProfile()})}else finishProfile();
}
function finishProfile(){save();closeModal();syncSide();showPage(currentPage);toast('프로필을 저장했어요!')}
function newPost(){document.getElementById('photoPicker').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 compress(f,url=>{openModal(`<h3>새 게시물</h3><img src="${url}" style="width:100%;max-height:260px;object-fit:contain;margin-bottom:12px"><textarea id="postCaption" placeholder="문구를 입력하세요..."></textarea><div class="modalbuttons"><button class="cancel" onclick="closeModal()">취소</button><button class="primary" onclick="publishPost('${url}')">게시하기</button></div>`);e.target.value='';});
 };document.getElementById('photoPicker').click()}
function publishPost(url){
 const caption=document.getElementById('postCaption').value;
 posts.push({id:++nextId,url,caption,likes:0,liked:false,comments:[]});save();closeModal();showPage('home');toast('게시물을 올렸어요!');
}
function addStory(){
 const picker=document.getElementById('storyPicker');
 picker.onchange=e=>{const f=e.target.files[0];if(!f)return;compress(f,url=>{stories.push({url,label:profile.username});save();showPage('home');toast('스토리를 추가했어요!')});picker.value=''};
 picker.click();
}
function viewStory(i){
 const s=stories[i];if(!s)return;
 openModal(`<h3>${esc(s.label||'스토리')}</h3><img src="${esc(s.url)}" style="width:100%;max-height:65vh;object-fit:contain"><div class="modalbuttons"><button class="cancel" onclick="closeModal()">닫기</button><button class="cancel" onclick="deleteStory(${i})">삭제</button></div>`);
}
function deleteStory(i){stories.splice(i,1);save();closeModal();showPage(currentPage)}
function toggleLike(id){const p=posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;save();showPage(currentPage)}
function commentPost(id){
 openModal(`<h3>댓글 달기</h3><textarea id="commentText" placeholder="댓글을 입력하세요..."></textarea><div class="modalbuttons"><button class="cancel" onclick="closeModal()">취소</button><button class="primary" onclick="saveComment(${id})">게시</button></div>`);
}
function saveComment(id){
 const text=document.getElementById('commentText').value.trim();if(!text)return;
 const p=posts.find(x=>x.id===id);p.comments=p.comments||[];p.comments.push({user:profile.username,text});save();closeModal();showPage(currentPage);
}
function submitComment(id){
 const input=document.getElementById('comment-'+id);if(!input||!input.value.trim())return;
 const p=posts.find(x=>x.id===id);p.comments=p.comments||[];p.comments.push({user:profile.username,text:input.value.trim()});save();showPage(currentPage);
}
function deletePost(id){
 openModal(`<h3>게시물 옵션</h3><p>이 게시물을 삭제할까요?</p><div class="modalbuttons"><button class="cancel" onclick="closeModal()">취소</button><button class="primary" onclick="confirmDelete(${id})">삭제</button></div>`);
}
function confirmDelete(id){posts=posts.filter(p=>p.id!==id);save();closeModal();showPage(currentPage)}
function openPost(id){showPage('home');setTimeout(()=>{const p=posts.find(x=>x.id===id);if(p)document.querySelectorAll('.postimg').forEach(img=>{if(img.src===p.url)img.scrollIntoView({behavior:'smooth',block:'center'})})},50)}
function compress(file,callback){
 if(!file.type.startsWith('image/')){toast('이미지 파일을 선택해 주세요.');return}
 const reader=new FileReader();
 reader.onload=ev=>{
  const img=new Image();
  img.onload=()=>{
   const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height));
   const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   callback(canvas.toDataURL('image/jpeg',0.78));
  };
  img.onerror=()=>toast('이미지를 읽지 못했어요.');img.src=ev.target.result;
 };
 reader.readAsDataURL(file);
}
syncSide();showPage('home');
</script>
