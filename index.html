
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram</title>
<style>
*{box-sizing:border-box}
:root{--line:#dbdbdb;--blue:#0095f6;--text:#262626;--muted:#737373}
body{margin:0;color:var(--text);font:14px Arial,"Noto Sans KR",sans-serif;background:white}
button,input,textarea{font:inherit}button{cursor:pointer}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.avatar{border-radius:50%;object-fit:cover;background:#eee;flex-shrink:0}
.brand{font-family:Georgia,serif;font-size:29px;font-weight:bold;letter-spacing:-1.5px;margin:0 0 35px;padding:0 12px}
.sidebar{position:fixed;inset:0 auto 0 0;width:245px;border-right:1px solid var(--line);padding:28px 12px 18px;display:flex;flex-direction:column;background:white;z-index:10}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{display:flex;align-items:center;gap:16px;width:100%;padding:12px;border:0;border-radius:9px;background:white;text-align:left;font-size:16px}
.nav button:hover{background:#f5f5f5}
.nav-bottom{margin-top:auto}
main{margin-left:245px;padding:0 24px 45px}
.page{max-width:935px;margin:auto}
.mobile-header,.bottom-nav{display:none}
.profile{display:grid;grid-template-columns:1fr 2fr;gap:28px;padding:40px 0 35px;border-bottom:1px solid var(--line)}
.avatar-col{display:flex;justify-content:center}
.profile-avatar{width:150px;height:150px}
.profile-info{min-width:0}
.profile-top{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.username{font-size:20px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:8px 13px;font-weight:600}
.gray{background:#efefef}.blue{background:var(--blue);color:white}
.stats{display:flex;gap:35px;list-style:none;padding:0;margin:0 0 20px}
.stats strong{font-weight:600}
.display-name{font-weight:600;margin-bottom:5px}
.bio{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
.stories{display:flex;gap:25px;overflow-x:auto;padding:12px 0 28px;scrollbar-width:none}
.story{width:80px;flex:0 0 80px;border:0;background:white;padding:0;text-align:center}
.story-ring{width:76px;height:76px;padding:3px;margin:0 auto 8px;border-radius:50%;background:linear-gradient(45deg,#ffb000,#ff3040,#c13584,#833ab4)}
.story-ring.seen{background:#ccc}
.story-inner{height:100%;padding:3px;border-radius:50%;background:white}
.story-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.story-label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.story-add .story-ring{background:#eee}
.story-add .story-inner{display:flex;align-items:center;justify-content:center;font-size:30px}
.tabs{display:flex;justify-content:center;gap:55px;border-top:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:7px;padding:15px 0;border:0;border-top:1px solid transparent;margin-top:-1px;background:white;color:var(--muted);font-size:12px}
.tab.active{border-top-color:#262626;color:#262626}
.tab svg{width:14px;height:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;background:#eee;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.tile:hover:after{content:"♥";position:absolute;inset:0;display:grid;place-items:center;color:white;background:#0004;font-size:32px}
.empty{grid-column:1/-1;text-align:center;padding:55px 10px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:#0009;z-index:30;display:flex;align-items:center;justify-content:center;padding:15px}
.modal{background:white;width:min(440px,100%);max-height:92vh;overflow:auto;border-radius:12px}
.modal-head{padding:15px;text-align:center;font-weight:bold;border-bottom:1px solid var(--line);position:relative}
.close{position:absolute;right:12px;top:7px;border:0;background:white;font-size:25px}
.modal-body{padding:20px}
.field{margin-bottom:15px}
.field label{display:block;font-weight:bold;margin-bottom:7px}
.field input,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px}
.field textarea{min-height:90px}
.full{width:100%}
.story-view{position:relative;width:min(400px,100%);height:min(740px,88vh);background:#222;border-radius:10px;overflow:hidden;color:white}
.story-view>img{width:100%;height:100%;object-fit:contain}
.story-head{position:absolute;top:18px;left:14px;right:45px;display:flex;align-items:center;gap:10px;z-index:1}
.story-head img{width:35px;height:35px;border:1px solid white}
.story-close{position:absolute;right:12px;top:10px;color:white;background:none;border:0;font-size:28px;z-index:2}
.story-arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;background:#fffa;width:35px;height:35px;font-size:22px}
.story-arrow.left{left:8px}.story-arrow.right{right:8px}
.post-view{width:min(850px,100%);display:grid;grid-template-columns:1.2fr .8fr;background:white;max-height:90vh}
.post-photo{background:#111;display:grid;place-items:center;min-height:250px}
.post-photo img{max-width:100%;max-height:85vh;object-fit:contain}
.post-right{display:flex;flex-direction:column;min-width:0}
.post-author{padding:14px;border-bottom:1px solid var(--line);font-weight:bold}
.comments{padding:14px;flex:1;overflow:auto;max-height:300px;line-height:1.6;overflow-wrap:anywhere}
.comment{margin-bottom:12px}
.post-tools{padding:12px;border-top:1px solid var(--line)}
.tool-buttons{display:flex;gap:15px;margin-bottom:8px}
.tool-buttons button{border:0;background:white;padding:0}
.comment-form{display:flex;padding:12px;border-top:1px solid var(--line);gap:8px}
.comment-form input{flex:1;min-width:0;border:0}
.comment-form button{border:0;background:white;color:var(--blue);font-weight:bold}
.dm{width:min(850px,100%);display:grid;grid-template-columns:220px 1fr;height:min(650px,85vh);background:white}
.dm-list{border-right:1px solid var(--line);overflow:auto}
.dm-list h3{padding:12px}
.contact{display:flex;align-items:center;gap:9px;padding:12px;width:100%;border:0;background:white;text-align:left}
.contact:hover,.contact.selected{background:#f5f5f5}
.contact img{width:40px;height:40px}
.chat{display:flex;flex-direction:column;min-width:0}
.chat-head{padding:12px;border-bottom:1px solid var(--line);font-weight:bold}
.messages{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.bubble{background:#efefef;border-radius:18px;padding:10px 13px;max-width:80%;align-self:flex-start;overflow-wrap:anywhere}
.bubble.mine{background:#3797f0;color:white;align-self:flex-end}
.dm-form{display:flex;gap:8px;padding:12px}
.dm-form input{min-width:0;flex:1;border:1px solid var(--line);border-radius:20px;padding:10px}
.dm-form button{border:0;background:white;color:var(--blue)}
@media(max-width:767px){
.sidebar{display:none}main{margin:0;padding:0 0 60px}
.mobile-header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #eee;position:sticky;top:0;background:white;z-index:10}
.mobile-header .brand{font-size:25px;margin:0;padding:0}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:54px;background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:20}
.bottom-nav button{border:0;background:white;padding:8px}
.profile{grid-template-columns:85px 1fr;gap:12px;padding:22px 14px 15px}
.profile-avatar{width:76px;height:76px}
.avatar-col{justify-content:flex-start}
.profile-top{gap:8px;margin-bottom:10px}
.username{font-size:18px;width:100%}
.actions{gap:5px}.actions .btn{font-size:12px;padding:7px}
.stats{grid-column:1/-1;grid-row:2;justify-content:space-around;gap:5px;margin:8px -90px 0 -95px;padding-top:12px;border-top:1px solid #eee;font-size:12px}
.stats strong{display:block;text-align:center;font-size:14px}
.stories{gap:17px;padding:12px 12px 22px}
.story{width:65px;flex-basis:65px}.story-ring{width:62px;height:62px}
.tabs{gap:0}.tab{flex:1;justify-content:center}.tab span{display:none}
.grid{gap:2px}
.overlay{padding:0}.modal{border-radius:0;max-height:100vh;width:100%}
.post-view{grid-template-columns:1fr;max-height:100vh;overflow:auto}
.post-photo{min-height:180px;max-height:38vh}.post-photo img{max-height:38vh}
.post-right{min-height:260px}.comments{max-height:180px}
.dm{grid-template-columns:90px 1fr;height:calc(100vh - 50px)}
.dm-list h3{font-size:12px;padding:12px 5px}
.contact{flex-direction:column;gap:4px;padding:10px 2px;text-align:center;font-size:11px}
.contact img{width:38px;height:38px}
.story-view{width:100%;height:100vh;border-radius:0}
}
@media(min-width:768px) and (max-width:1100px){
.sidebar{width:74px;align-items:center}.sidebar .brand{font-size:0;padding:0}.sidebar .brand:after{content:"◎";font-size:32px}.nav button{justify-content:center;padding:12px}.nav-label{display:none}main{margin-left:74px}
}
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden">
<symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H14v-7h-4v7H3z"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 5.9l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.5a5.5 5.5 0 0 0 0-7.7z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16 16 5 5"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></symbol>
<symbol id="message" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-8.8 8.4 9 9 0 0 1-3.8-.9L3 21l1.7-4.8a8.3 8.3 0 1 1 16.3-4.7z"/></symbol>
</svg>

<aside class="sidebar">
<div class="brand">Instagram</div>
<nav class="nav">
<button><svg><use href="#home"/></svg><span class="nav-label">홈</span></button>
<button onclick="alert('검색 기능은 아직 준비 중이에요.')"><svg><use href="#search"/></svg><span class="nav-label">검색</span></button>
<button onclick="openDM()"><svg><use href="#message"/></svg><span class="nav-label">메시지</span></button>
<button onclick="newPost()"><svg><use href="#plus"/></svg><span class="nav-label">만들기</span></button>
<button onclick="editProfile()"><svg><use href="#heart"/></svg><span class="nav-label">프로필 편집</span></button>
</nav>
</aside>

<header class="mobile-header">
<div class="brand">Instagram</div>
<button onclick="newPost()" style="border:0;background:white"><svg><use href="#plus"/></svg></button>
</header>

<main><div class="page">
<section class="profile">
<div class="avatar-col"><img id="profileAvatar" class="avatar profile-avatar" alt="프로필 사진"></div>
<div class="profile-info">
<div class="profile-top"><span id="username" class="username"></span><div class="actions"><button class="btn gray" onclick="editProfile()">프로필 편집</button><button class="btn gray" onclick="openDM()">메시지</button><button class="btn gray" onclick="newPost()">＋</button></div></div>
<ul class="stats"><li><strong id="postCount">0</strong> 게시물</li><li><strong>1,248</strong> 팔로워</li><li><strong>386</strong> 팔로잉</li></ul>
<div id="displayName" style="font-weight:bold;margin-bottom:5px"></div><div id="bio" class="bio"></div><div id="website"></div>
</div>
</section>
<section id="stories" class="stories"></section>
<div class="tabs">
<button class="tab active" data-tab="posts"><svg><use href="#grid"/></svg><span>게시물</span></button>
<button class="tab" data-tab="saved"><svg><use href="#heart"/></svg><span>저장됨</span></button>
</div>
<section id="grid" class="grid"></section>
</div></main>

<nav class="bottom-nav">
<button aria-label="홈"><svg><use href="#home"/></svg></button>
<button aria-label="검색" onclick="alert('검색 기능은 아직 준비 중이에요.')"><svg><use href="#search"/></svg></button>
<button aria-label="게시물 추가" onclick="newPost()"><svg><use href="#plus"/></svg></button>
<button aria-label="메시지" onclick="openDM()"><svg><use href="#message"/></svg></button>
</nav>
<div id="modalRoot"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function placeholder(label,color='#d9dce5'){
return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" fill="${color}"/><circle cx="150" cy="115" r="55" fill="#ffffff66"/><path d="M40 300 Q150 150 260 300" fill="#ffffff66"/><text x="150" y="285" text-anchor="middle" font-size="18" fill="#555">${label}</text></svg>`)
}
const initial={
profile:{username:'your_username',name:'Your Name',bio:'일상의 기록 ✨\n좋아하는 것들을 모아두는 공간',website:'',avatar:placeholder('profile','#e7d7d1')},
stories:[
{id:'s1',label:'daily',image:placeholder('daily','#e7c9bc'),seen:false},
{id:'s2',label:'mood',image:placeholder('mood','#c8d5e6'),seen:false},
{id:'s3',label:'memory',image:placeholder('memory','#e4d9a9'),seen:false}
],
posts:[],
chats:[
{id:'c1',name:'민지',avatar:placeholder('민지','#e6c9dc'),messages:[{mine:false,text:'오늘 뭐 해?'},{mine:true,text:'그냥 쉬는 중!'}]},
{id:'c2',name:'지우',avatar:placeholder('지우','#c8d9c6'),messages:[{mine:false,text:'사진 너무 잘 나왔다 ㅎㅎ'}]}
]};
let state;
try{state=JSON.parse(localStorage.getItem('instagramMockup'))||JSON.parse(JSON.stringify(initial))}catch(e){state=JSON.parse(JSON.stringify(initial))}
state.profile ||= initial.profile;state.stories ||= [];state.posts ||= [];state.chats ||= [];
let tab='posts',chatId=state.chats[0]?.id;
function save(){try{localStorage.setItem('instagramMockup',JSON.stringify(state))}catch(e){alert('저장 공간이 부족해요. 사진 크기를 줄여 주세요.')}}
function render(){
$('#profileAvatar').src=state.profile.avatar;
$('#username').textContent=state.profile.username;
$('#displayName').textContent=state.profile.name;
$('#bio').textContent=state.profile.bio;
$('#website').textContent=state.profile.website;
$('#website').style.cssText='color:#00376b;font-weight:bold;margin-top:5px';
$('#postCount').textContent=state.posts.length;
$('#stories').innerHTML=`<button class="story story-add" onclick="newStory()"><div class="story-ring"><div class="story-inner">+</div></div><span class="story-label">새 스토리</span></button>`+state.stories.map((s,i)=>`<button class="story" onclick="showStory(${i})"><div class="story-ring ${s.seen?'seen':''}"><div class="story-inner"><img src="${s.image}" alt=""></div></div><span class="story-label">${esc(s.label)}</span></button>`).join('');
const posts=tab==='saved'?state.posts.filter(p=>p.saved):state.posts;
$('#grid').innerHTML=posts.length?posts.slice().reverse().map(p=>`<button class="tile" onclick="showPost('${p.id}')"><img src="${p.image}" alt=""><span class="hidden">${esc(p.caption)}</span></button>`).join(''):`<div class="empty">${tab==='saved'?'저장한 게시물이 없어요.':'게시물이 아직 없어요. + 버튼으로 사진을 추가해 보세요.'}</div>`;
}
function modal(title,content,wide=false){
$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal ${wide?'wide':''}"><header class="modal-head">${title}<button class="close" onclick="closeModal()">×</button></header>${content}</section></div>`;
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
}
function closeModal(){$('#modalRoot').innerHTML=''}
function editProfile(){
modal('프로필 편집',`<form id="profileForm" class="modal-body">
<div class="field"><label>아이디</label><input name="username" maxlength="30" required value="${esc(state.profile.username)}"></div>
<div class="field"><label>이름</label><input name="name" maxlength="50" value="${esc(state.profile.name)}"></div>
<div class="field"><label>소개</label><textarea name="bio" maxlength="500">${esc(state.profile.bio)}</textarea></div>
<div class="field"><label>웹사이트</label><input name="website" value="${esc(state.profile.website)}" placeholder="https://..."></div>
<div class="field"><label>프로필 사진</label><input name="avatar" type="file" accept="image/*"></div>
<button class="btn blue full">저장</button></form>`);
$('#profileForm').onsubmit=async e=>{
e.preventDefault();const f=e.target;
state.profile.username=f.username.value.trim()||'user';state.profile.name=f.name.value;state.profile.bio=f.bio.value;state.profile.website=f.website.value;
if(f.avatar.files[0])state.profile.avatar=await readImage(f.avatar.files[0]);
save();render();closeModal();
};
}
function readImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,1200/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function newPost(isStory=false){
modal(isStory?'새 스토리':'새 게시물',`<form id="uploadForm" class="modal-body">
<div class="upload"><p id="hint">사진을 선택해 주세요</p><img id="preview" class="hidden" style="max-width:100%;max-height:220px;object-fit:contain"><input name="photo" type="file" accept="image/*" required></div>
<div class="field"><label>${isStory?'스토리 이름':'캡션'}</label>${isStory?'<input name="caption" maxlength="30" placeholder="daily">':'<textarea name="caption" maxlength="1000" placeholder="사진에 대해 적어 보세요."></textarea>'}</div>
<button class="btn blue full"> ${isStory?'스토리 올리기':'게시물 공유'} </button></form>`);
const form=$('#uploadForm');
form.photo.onchange=async()=>{const file=form.photo.files[0];if(!file)return;$('#preview').src=await readImage(file);$('#preview').classList.remove('hidden');$('#hint').classList.add('hidden')};
form.onsubmit=async e=>{e.preventDefault();const file=form.photo.files[0];if(!file)return;const image=$('#preview').src;const caption=form.caption.value.trim();const id='p'+Date.now();
if(isStory)state.stories.push({id,label:caption||'스토리',image,seen:false});
else state.posts.push({id,image,caption,likes:0,liked:false,saved:false,comments:[]});
save();render();closeModal()};
}
function newStory(){newPost(true)}
function showStory(index){
if(!state.stories.length)return;
const s=state.stories[index];s.seen=true;save();render();
modal('',`<div class="story-view"><button class="story-close" onclick="closeModal()">×</button><img id="storyImage" src="${s.image}" alt="스토리"><div class="story-head"><img class="avatar" src="${state.profile.avatar}"><strong>${esc(state.profile.username)}</strong><span>· 방금</span></div><button class="story-arrow left" onclick="changeStory(${index},-1)">‹</button><button class="story-arrow right" onclick="changeStory(${index},1)">›</button></div>`);
}
function changeStory(index,delta){const next=(index+delta+state.stories.length)%state.stories.length;showStory(next)}
function showPost(id){
const p=state.posts.find(x=>x.id===id);if(!p)return;
modal('',`<div class="post-view"><div class="post-photo"><img src="${p.image}"></div><div class="post-right"><div class="post-author">${esc(state.profile.username)} <button class="close" onclick="deletePost('${p.id}')">⋯</button></div><div class="comments">${p.caption?`<div class="comment"><b>${esc(state.profile.username)}</b> ${esc(p.caption)}</div>`:''}${p.comments.map(c=>`<div class="comment"><b>${esc(c.user)}</b> ${esc(c.text)}</div>`).join('')}</div><div class="post-tools"><div class="tool-buttons"><button onclick="likePost('${p.id}')">${p.liked?'❤️':'♡'}</button><button onclick="document.querySelector('#commentInput').focus()">댓글</button><button style="margin-left:auto" onclick="savePost('${p.id}')">${p.saved?'저장됨':'저장'}</button></div><b>${p.likes} 좋아요</b></div><form class="comment-form" id="commentForm"><input id="commentInput" maxlength="500" placeholder="댓글 달기..." required><button>게시</button></form></div></div>`,true);
$('#commentForm').onsubmit=e=>{e.preventDefault();const text=$('#commentInput').value.trim();if(!text)return;p.comments.push({user:state.profile.username,text});save();showPost(id)};
}
function likePost(id){const p=state.posts.find(x=>x.id===id);p.liked=!p.liked;p.likes=Math.max(0,p.likes+(p.liked?1:-1));save();showPost(id)}
function savePost(id){const p=state.posts.find(x=>x.id===id);p.saved=!p.saved;save();showPost(id)}
function deletePost(id){if(confirm('게시물을 삭제할까요?')){state.posts=state.posts.filter(p=>p.id!==id);save();closeModal();render()}}
function openDM(){
const c=state.chats.find(x=>x.id===chatId)||state.chats[0];
modal('메시지',`<div class="dm"><aside class="dm-list"><h3>${esc(state.profile.username)}</h3>${state.chats.map(x=>`<button class="contact ${x.id===c?.id?'selected':''}" onclick="selectChat('${x.id}')"><img class="avatar" src="${x.avatar}"><span>${esc(x.name)}</span></button>`).join('')}<button class="contact" onclick="addChat()">＋ 대화 추가</button></aside><section class="chat">${c?`<div class="chat-head">${esc(c.name)}</div><div class="messages" id="messages">${c.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}</div><form class="dm-form" id="dmForm"><input name="message" maxlength="1000" placeholder="메시지 보내기..." required><button>보내기</button></form>`:'대화를 추가해 주세요.'}</section></div>`,true);
const messages=$('#messages');if(messages)messages.scrollTop=messages.scrollHeight;
const f=$('#dmForm');if(f)f.onsubmit=e=>{e.preventDefault();const text=f.message.value.trim();if(!text||!c)return;c.messages.push({mine:true,text});save();openDM()};
}
function selectChat(id){chatId=id;openDM()}
function addChat(){
modal('새 대화',`<form class="modal-body" id="newChatForm"><div class="field"><label>친구 이름</label><input name="name" required maxlength="40"></div><button class="btn blue full">만들기</button></form>`);
$('#newChatForm').onsubmit=e=>{e.preventDefault();const name=e.target.name.value.trim();chatId='c'+Date.now();state.chats.push({id:chatId,name,avatar:placeholder(name,'#d8d8e8'),messages:[]});save();openDM()};
}
document.addEventListener('click',e=>{
const story=e.target.closest('[data-story]');if(story)showStory(Number(story.dataset.story));
const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body>
</html>
